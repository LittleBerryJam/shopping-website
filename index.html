<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Store name here</title>
        <meta charset="utf-8">
        <style>
            .shopItem{
                border: 1px solid black;
                display: inline-block;
                padding: 1rem;
            }
            #cart{
                border: 1px solid black;
                display: inline-block;
                padding: 1rem;
            }
            .cartItem{
                border: 1px solid black;
                display: inline-block;
                padding: 1rem;
            }
            .removeButton{
                cursor: pointer;
            }
        </style>
        <script>
            cart = [];
            function addCartItem(item){
                let cartItems = document.getElementById("cartItems");
                let itemDiv = document.createElement("div");
                let itemName = document.createElement("p");
                let remove = document.createElement("p");
                itemName.innerHTML = item.prod_name;
                remove.innerHTML = "Remove";
                itemDiv.className = "cartItem";
                itemDiv.appendChild(itemName);
                itemDiv.appendChild(remove);
                remove.setAttribute("onclick", "remove()");
                remove.setAttribute("class", "removeButton");
                itemDiv.setAttribute("index", cart.length);
                cartItems.appendChild(itemDiv);

            }
            function addToCart(){
                let itemHTML = event.srcElement.parentElement;
                let item = {};
                for(tag of itemHTML.children){
                    if(tag.tagName == "H1"){
                        item.prod_name = tag.innerHTML;
                    }
                    if(tag.innerHTML.charAt(0) == "₱"){
                        item.prod_price = tag.innerHTML;
                    }
                    
                }
                addCartItem(item);
                cart.push(item);
            }
            function remove(){
                let itemDiv = event.srcElement.parentElement;
                let indexRemove = itemDiv.getAttribute("index")
                cart.splice(indexRemove,1);
                itemDiv.remove();
            }
        </script>
    </head>
    <body>
        <div id="shopList">
            <div class="shopItem">
                <h1>Test item 1</h1>
                <p>Description 1</p>
                <p>₱ 100.00</p>
                <button onclick="addToCart()">Add to cart</button>
            </div>
            <div class="shopItem">
                <h1>Test item 2</h1>
                <p>Description 2</p>
                <p>₱ 50.00</p>
                <button onclick="addToCart()">Add to cart</button>
            </div>
        </div>
        <div id="cart">
            <h1>Cart</h1>
            <div id="cartItems">
            </div>
        </div>
        <form action="http://47.129.9.35/cs3/checkout.php" method="get">
            <label for="name">Name</label>
            <input type="text" name="cust_name" id="name" required>
            <label for="address">Delivery Address</label>
            <input type="text" name="cust_addr" id="address" required>
            <label for="email">Email</label>
            <input type="text" name="cust_email" id="email" required>
            <input hidden name="cust_order">
            <input type="submit">
        </form>
    </body>
</html>
